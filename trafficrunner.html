<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hyderabad Traffic Runner - PixelCroma Game Studio</title>
<style>
  body{margin:0;background:#050a1e;color:white;font-family:sans-serif;overflow:hidden;text-align:center}
  canvas{background:#111;display:block;margin:0 auto;border:3px solid #00c8ff;border-radius:18px}
  #ui{font-size:20px;margin:8px;color:#00e5ff;font-weight:bold}
  button{padding:12px 26px;background:#00c8ff;color:white;border:none;border-radius:25px;font-size:16px;font-weight:bold;margin:6px}
</style>
</head>
<body>
<div id="ui">Score: 0 | Hyderabad Runner</div>
<canvas id="game" width="360" height="640"></canvas>
<div>
<button onclick="startGame()">START / RESTART</button>
<button onclick="left()">◀ LEFT</button>
<button onclick="right()">RIGHT ▶</button>
</div>
<p style="font-size:11px;color:#88aaff">Swipe Left/Right or Use Buttons • Collect Biryani 🍛 Avoid Traffic • Made by PixelCroma Hyderabad</p>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let score,playing,player,roads,enemies,coins,speed,loop;

const LANES=[60,180,300]; // 3 lanes
const PLAYER_Y=520;
const ROAD_COLOR='#1e293b';

function startGame(){
  score=0; speed=4; playing=true;
  player={lane:1, x:LANES[1], y:PLAYER_Y, w:32, h:50};
  enemies=[]; coins=[]; roads=[];
  for(let i=0;i<5;i++) roads.push({y:i*160-100});
  clearInterval(loop);
  loop=setInterval(update,16);
}

function left(){ if(player.lane>0){ player.lane--; } }
function right(){ if(player.lane<2){ player.lane++; } }

canvas.addEventListener('touchstart', e=>{
  let x=e.touches[0].clientX;
  if(x<180) left(); else right();
});

let lastSpawn=0;
function update(){
  if(!playing) return;
  // Clear
  ctx.fillStyle=ROAD_COLOR; ctx.fillRect(0,0,360,640);
  
  // Roads - moving lines
  ctx.strokeStyle='#334155'; ctx.lineWidth=4; ctx.setLineDash([20,30]);
  for(let r of roads){
    r.y+=speed;
    if(r.y>700) r.y=-100;
    ctx.beginPath();
    ctx.moveTo(120, r.y); ctx.lineTo(120, r.y+80); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(240, r.y); ctx.lineTo(240, r.y+80); ctx.stroke();
  }
  ctx.setLineDash([]);
  
  // Lerp player to lane
  let targetX=LANES[player.lane];
  player.x += (targetX-player.x)*0.2;
  
  // Spawn enemies (traffic)
  if(Date.now()-lastSpawn > 800 - speed*50){
    if(Math.random()<0.7){
      let lane=Math.floor(Math.random()*3);
      enemies.push({lane:lane, x:LANES[lane], y:-60, w:32, h:50, type: Math.random()>0.5?'🚗':'🛺'});
    }
    if(Math.random()<0.5){
      let lane=Math.floor(Math.random()*3);
      coins.push({lane:lane, x:LANES[lane], y:-40, w:24, h:24});
    }
    lastSpawn=Date.now();
  }
  
  // Draw Coins (Biryani)
  for(let i=coins.length-1;i>=0;i--){
    let c=coins[i]; c.y+=speed;
    ctx.font='24px sans-serif'; ctx.fillText('🍛', c.x-12, c.y);
    if(Math.abs(c.y-player.y)<30 && c.lane===player.lane){
      score+=10; coins.splice(i,1); continue;
    }
    if(c.y>700) coins.splice(i,1);
  }
  
  // Draw Enemies
  for(let i=enemies.length-1;i>=0;i--){
    let e=enemies[i]; e.y+=speed;
    ctx.font='32px sans-serif'; ctx.fillText(e.type, e.x-16, e.y+10);
    // Collision
    if(Math.abs(e.y-player.y)<35 && e.lane===player.lane){
      endGame(); return;
    }
    if(e.y>700) enemies.splice(i,1);
  }
  
  // Draw Player (Auto)
  ctx.font='40px sans-serif'; ctx.fillText('🛵', player.x-18, player.y+12);
  // Shadow
  ctx.fillStyle='rgba(0,200,255,0.3)'; ctx.fillRect(player.x-20, player.y+18, 40, 6);
  
  score+=0.05;
  document.getElementById('ui').innerText=`Score: ${Math.floor(score)} | Speed: ${speed.toFixed(1)} | Hyderabad Runner`;
  
  if(score>0 && Math.floor(score)%100===0) speed+=0.3;
}

function endGame(){
  playing=false; clearInterval(loop);
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,360,640);
  ctx.fillStyle='#00e5ff'; ctx.font='bold 30px sans-serif';
  ctx.fillText('Ayyo! Traffic! ', 60, 280);
  ctx.font='22px sans-serif'; ctx.fillStyle='white';
  ctx.fillText(`Score: ${Math.floor(score)}`, 110, 320);
  ctx.font='14px sans-serif';
  ctx.fillText('Hyderabad traffic is no joke da!', 70, 350);
  ctx.fillText('Share on WhatsApp & challenge friends', 40, 380);
}

startGame();
</script>
</body>
</html>
